name: E2E (kind)

# Stands up the real substrate — kind + Calico + Chaos Mesh — and then runs two
# things against it, in this order:
#
#   1. The rig's own control (`make e2e`): three nodes Ready, the Chaos Mesh
#      CRDs registered with chaos-daemon rolled out, and a CNI that actually
#      enforces NetworkPolicy.
#   2. A scored eval run (`make eval-lookout`): inject the lookout pack, gate
#      each fault on its efficacy probes, ask k8s-lookout, print the scorecard.
#
# Step 1 first, because it is an assertion about the environment rather than
# about Simian, and every measurement in step 2 is read through that
# environment. A cluster that accepts a NetworkPolicy and ignores it, or runs a
# chaos-daemon pointed at the wrong container socket, produces faults that never
# land — with no error anywhere to say so. Downstream that reads as the subject
# under test failing to notice an incident that never happened.
#
# Two tiers for step 2, mirroring lookout's own e2e-kind.yml so the two repos'
# cluster jobs stay recognisably the same shape:
#
#   - push to main   → smoke: image-pull, crash-loop and the healthy control
#                      (a fault that lands in seconds, one that takes four
#                      minutes to become steady, and the case where nothing is
#                      wrong and saying so is the right answer)
#   - weekly/manual  → the whole pack
#
# What is gated is the efficacy rate, not the score: every fault must land, and
# a detector that got worse at diagnosing them is k8s-lookout's bug, not a
# reason to fail Simian's build. See dev/tools/eval-lookout.
#
# Deliberately NOT a pull_request job. It builds a three-node cluster and pulls
# Calico and the Chaos Mesh chart from the network, so its failure modes include
# "GitHub raw was slow". A ~98%-reliable required check taxes every PR. The
# presubmits in ci.yml stay hermetic; this is the "something real is
# continuously tested" tier.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/workflows/docs*.yml'
      - '.github/workflows/release*.yml'
  schedule:
    - cron: '41 5 * * 1' # Mondays 05:41 UTC — off the :00 stampede
  workflow_dispatch:
    inputs:
      scenarios:
        description: 'comma-separated scenario IDs for the eval (empty = the whole pack)'
        required: false
        default: ''

permissions:
  contents: read
  issues: write

# Not cancel-in-progress: a half-cancelled run can leave a cluster behind, and
# the teardown step is what proves `make cluster-down` still works.
concurrency:
  group: e2e-kind
  cancel-in-progress: false

env:
  GO_VERSION: '1.26'
  # Pinned to match the local install instructions in dev/README.md. The kind
  # version decides the default node image and the create semantics, both of
  # which the cluster config depends on.
  KIND_VERSION: v0.32.0
  HELM_VERSION: v3.19.0
  # The push-to-main eval tier. Three scenarios rather than nine, chosen for
  # coverage rather than speed: a fault that lands in two seconds, one whose
  # three efficacy gates take about four minutes to agree it is steady, and the
  # control where the namespace is healthy and reporting nothing is correct.
  # The weekly run takes the other six.
  SMOKE_SCENARIOS: lookout-image-pull,lookout-crash-loop,lookout-healthy

jobs:
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    # Acceptance for #53 is "under ~10 minutes" for the cluster and its control.
    # The eval adds the pack on top — measured at 5m45s for all nine scenarios
    # on a workstation, and a two-core runner is slower than that. The ceiling
    # is set well above the sum so a slow run reports as slow rather than as a
    # timeout with no logs.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-e2e-${{ env.GO_VERSION }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-e2e-${{ env.GO_VERSION }}-

      - name: Install kind
        run: go install sigs.k8s.io/kind@${{ env.KIND_VERSION }}

      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      # `make`, not a dev/ci/presubmits/ delegator as the other workflows use:
      # these are the commands a developer runs, and having CI run the same
      # literal command is what keeps the documented path from rotting. The
      # logic still lives in dev/tools/, not in this YAML.
      - name: Cluster up
        run: make cluster

      - name: E2E suite
        run: make e2e

      # The scored run. k8s-lookout is a deterministic detector rather than an
      # agent, which is what makes this a test at all: two runs of one scenario
      # that disagree have exactly one possible cause, and it is ours.
      - name: Lookout eval
        env:
          # Via env, never interpolated into the script. simian-eval validates
          # --only against the pack and errors on an unknown ID rather than
          # running nothing, so a typo here fails loudly.
          SCENARIOS: ${{ inputs.scenarios }}
          SIMIAN_EVAL_OUT: runs/ci-${{ github.run_id }}
        run: |
          case "${{ github.event_name }}" in
            push)
              make eval-lookout ARGS="--only $SMOKE_SCENARIOS"
              ;;
            *)
              if [ -n "$SCENARIOS" ]; then
                make eval-lookout ARGS="--only $SCENARIOS"
              else
                make eval-lookout
              fi
              ;;
          esac

      # Kept on success as well as on failure. run.json is the scorecard's
      # source, and the interesting question about a detector baseline is how
      # it moved between two weeks — which needs the passing runs too.
      - name: Upload eval run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-run-${{ github.run_id }}
          path: runs/
          if-no-files-found: warn
          retention-days: 30

      # Before the teardown, not after it. Every command below reads the live
      # cluster, and `make cluster-down` deletes the nodes those reads go to —
      # so with the two the other way round each file collected is a connection
      # refused, swallowed by the `|| true` that is there to keep one missing
      # component from hiding the rest.
      - name: Collect forensics
        if: failure()
        env:
          KUBECONFIG: ${{ github.workspace }}/.kube/e2e.yaml
        run: |
          mkdir -p _forensics
          kubectl get nodes -o wide            >_forensics/nodes.txt 2>&1 || true
          kubectl get pods -A -o wide          >_forensics/pods.txt 2>&1 || true
          kubectl get events -A --sort-by=.lastTimestamp >_forensics/events.txt 2>&1 || true
          kubectl -n kube-system describe ds/calico-node >_forensics/calico-node.txt 2>&1 || true
          kubectl -n chaos-mesh get all        >_forensics/chaos-mesh.txt 2>&1 || true
          kubectl -n chaos-mesh logs ds/chaos-daemon --tail=-1 --all-containers \
                                               >_forensics/chaos-daemon.log 2>&1 || true
          kubectl get crd -o name | grep chaos >_forensics/chaos-crds.txt 2>&1 || true
          # Arena namespaces are torn down per scenario, so what survives a
          # failed eval is whichever one the run died in.
          kubectl get ns -o wide               >_forensics/namespaces.txt 2>&1 || true

      # Runs on success too: tearing the cluster down is part of what this
      # workflow is here to keep working, and a runner is the only place it gets
      # exercised on every merge.
      - name: Cluster down
        if: always()
        run: make cluster-down

      - name: Upload forensics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-forensics-${{ github.run_id }}
          path: _forensics/
          retention-days: 14

      # Post-merge failures are otherwise silent — nobody reliably watches the
      # Actions tab. One open issue collects repeats so a broken week does not
      # file a duplicate per merge. Manual dispatches don't file: whoever
      # clicked is watching.
      - name: File or update tracking issue on unattended failure
        if: failure() && github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          existing="$(gh issue list --repo "$REPO" --state open \
            --search 'kind e2e failed in:title' --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" \
              --body "Another failure ($(date -u +%Y-%m-%d), $SHA): $RUN_URL"
          else
            gh issue create --repo "$REPO" \
              --title "kind e2e failed: run ${{ github.run_id }}" \
              --body "The kind e2e run failed on $(date -u +%Y-%m-%d) at $SHA. Run: $RUN_URL

          Cluster state is attached as the e2e-forensics artifact, and the eval's audit log and run.json as eval-run. Which one to read depends on the step that failed.

          E2E suite: start with chaos-daemon.log and calico-node.txt. The two most likely causes are Chaos Mesh pointed at the wrong container socket and Calico failing to converge, and both present as faults that apply cleanly and do nothing. See dev/kind/cluster.yaml for why the CNI choice matters.

          Lookout eval: the run failed the efficacy gate, meaning a fault Simian applied did not become observable before its probes gave up. audit.log names the probe and what it saw. That is a Simian bug by construction — the subject is a deterministic detector, so it cannot be the variable."
          fi
