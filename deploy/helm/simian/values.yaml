# Default values for the simian Helm chart.

image:
  # Published by .github/workflows/release.yml on each `v*` tag push.
  repository: ghcr.io/go-steer/simian-agent
  # Empty default falls back to .Chart.AppVersion ("0.4.0-rc.5") in the
  # Deployment template, so chart bumps automatically pick up the matching
  # image tag without flipping this field.
  tag: ""
  pullPolicy: IfNotPresent

# Static eligible-namespace allowlist. When empty, the controller falls back
# to annotation-based lookup (`simian.chaos/eligible="true"`), which is the
# preferred mode for installations that use `simian arena create`. Set this
# only when you want to bypass annotation lookup entirely.
eligibleNamespaces: []

# M2 Part A: provisioner subsystem. When enabled, ships:
#   - simian-provisioner ServiceAccount + ClusterRole (cluster-scoped: ns + RB)
#   - ValidatingAdmissionPolicy backstop enforcing:
#       * provisioner-SA ns CREATE/UPDATE requires simian.chaos/eligible="true"
#       * provisioner-SA RoleBinding granting chaos SA may only target
#         eligible namespaces
# Disable for installations where arena management is performed by an
# operator using their kubeconfig (no in-cluster provisioner workload).
provisioner:
  enabled: true

# LLM provider configuration.
llm:
  provider: gemini       # gemini | stub
  model: ""              # default: gemini-2.5-pro
  vertex:
    enabled: true
    # Required when enabled: the GCP project whose Vertex AI the controller
    # calls, through its Workload Identity. No default — an install that
    # forgot it fails to render rather than calling someone else's project.
    project: ""
    location: us-central1
  apiKey:
    enabled: false
    # Mounted from a Kubernetes Secret named .Values.llm.apiKey.secretRef.
    secretRef: simian-llm
    secretKey: geminiApiKey

# Executor safety policy.
executor:
  durationCeiling: 15m   # hard cap per fault
  # Blast-radius tiers permitted by this installation: namespace | node |
  # external. Drop "node" to keep node-level chaos off the cluster entirely.
  # An empty list means "use the built-in default" (namespace, node) rather
  # than "permit nothing"; an unrecognised name stops the controller starting.
  permittedTiers:
    - namespace
    - node
  maxConcurrentFaults: 0 # 0 = no cap
  minCooldown: 0s        # per-namespace cooldown between consecutive faults
  recentFaultsCapacity: 100 # bounded ring backing get_recent_faults MCP tool

# M3: read-only topology discovery for the autonomous-mode planner.
# Powers the get_topology MCP tool and (in PR2) the plan generator.
topology:
  resync: 30s            # informer resync interval

# M3: SUT lifecycle inside the controller. When enabled, the controller's
# chaos-SA Role gains the verbs needed for the establish_baseline MCP tool
# to apply SUT manifests into eligible namespaces. Operators who keep
# 'simian sut deploy' running out-of-cluster (the default M2 path) can
# leave this false.
sutInController:
  enabled: false

# Post-M3: SUT-deploy-time injection of the Envoy fault sidecar
# (pkg/sut/envoy). When enabled, the controller's establish_baseline
# MCP tool mutates each SUT Deployment to add an Envoy sidecar +
# iptables init container, so the envoy-fault chaos engine has
# somewhere to send fault config. Per-workload opt-out is via the
# pod-template annotation simian.chaos/no-envoy-injection: "true".
#
# DEFAULT: false. The current injection model intercepts ALL inbound
# TCP on the SUT's service ports via iptables PREROUTING REDIRECT.
# Envoy speaks HTTP at L7 and does NOT understand gRPC health-probe
# payloads, so workloads with gRPC livenessProbe/readinessProbe on a
# redirected port will crash-loop after kubelet's probe failures kill
# the container. Online Boutique falls into this category for 9 of
# 12 services. Until probe rewriting (Istio's pilot-agent style) or
# an outbound-only redirect mode is implemented, only flip this to
# true for SUTs whose probes are HTTP-only or TCP-only.
#
# Other gating concerns when flipping to true: the iptables init
# container needs NET_ADMIN + runAsUser=0, so installations with a
# Pod Security Standards "restricted" enforcement on the SUT
# namespace will reject the injected pods.
#
# See https://go-steer.github.io/simian-agent/docs/known-limitations/
# and https://go-steer.github.io/simian-agent/docs/dpv2-chaos-engines/
# for the design rationale.
sutInjection:
  envoyFaults: false

# M3: autonomous-mode planning loop. When enabled the controller runs a
# tick-driven cycle: health-gate → topology snapshot → LLM plan generation
# → bounded execution under the executor's safety stage. Plans are always
# emitted (and audit-logged) before any fault is applied.
autonomous:
  enabled: false
  cycleInterval: 5m
  namespaces: []           # which arena namespaces the loop targets; required when enabled
  maxFaultsPerCycle: 3
  maxSeverityPerCycle: namespace  # highest blast tier the loop will apply: namespace | node | external
  hypothesisHint: ""       # optional soft preference passed to the LLM each cycle

# Durable audit trail. The controller always logs audit events to stdout;
# with this on it also appends them as JSON lines to a file, rotating to
# <path>.1 past maxBytes, and at start-up closes any fault the previous
# process applied and never ended (lease.expired, reason
# untracked-after-restart). Read it back with `simian audit export`.
#
# Persistence is on by default: the file is the record of what Simian did to
# the cluster, and on an emptyDir it is lost whenever the pod is deleted or
# rescheduled. The PVC (simian-audit) needs a default StorageClass, or set
# storageClass, and is kept on uninstall. A restarted controller no longer
# needs the file to stay within its fault budget (it adopts live faults from
# the cluster), so turning persistence off loses the history, not the safety.
# On GKE, stdout already reaches Cloud Logging as well.
audit:
  file:
    enabled: true
    path: /var/lib/simian/audit.jsonl
    maxBytes: 104857600    # 100 MiB per generation; two generations kept
    persistence:
      enabled: true
      size: 1Gi
      storageClass: ""     # empty: the cluster default

# Prometheus metrics on /metrics: faults applied and ended, recovery checks,
# autonomous cycles and skip reasons, active faults, counted from the audit
# events. The pod carries the prometheus.io/* scrape annotations; for GKE's
# managed Prometheus turn on podMonitoring, for prometheus-operator
# serviceMonitor (each needs its CRD installed).
metrics:
  enabled: true
  port: 9090
  podMonitoring:
    enabled: false       # monitoring.googleapis.com/v1 PodMonitoring (GKE Managed Prometheus)
    interval: 30s
  serviceMonitor:
    enabled: false       # monitoring.coreos.com/v1 ServiceMonitor (prometheus-operator)
    interval: 30s

# Web UI at /ui/ on its own port, with the JSON API and live event stream it
# reads under /api/, and /healthz for a load balancer.
#
# auth: none — read-only, for a port-forward or in-cluster access; nobody can
#   inject faults from the browser, because nobody can be identified.
# auth: iap — behind Identity-Aware Proxy (docs/web-ui-iap.md). Every
#   request must carry IAP's signed assertion; IAP decides who may view, and
#   iap.writers who may also inject and clear faults, each recorded in the
#   audit trail in their name. Only this port is exposed; MCP stays in the
#   cluster.
ui:
  enabled: true
  port: 8082
  # How this controller is labelled in a UI that watches several Simians,
  # e.g. the cluster's name. Empty: the UI shows the host.
  name: ""
  # Other pages that may call this controller from the browser with the
  # user's credentials — another Simian's UI, or the standalone UI — as
  # origins, e.g. https://simian-2.example.com. Behind IAP the load balancer
  # must also let CORS preflights through (docs/web-ui-iap.md).
  allowedOrigins: []
  auth: none
  iap:
    # The backend service's audience, /projects/NUMBER/global/backendServices/ID
    # (exact), or just the project number to accept any backend service in it.
    audience: ""
    projectNumber: ""
    # Emails, or "domain:example.com". Empty: everyone IAP lets in may view,
    # nobody may write.
    writers: []
    # Who may also turn autonomous mode on and off and configure it within
    # the executor limits, pause and resume it, and clear every fault at once
    # from the UI's Configuration panel. Their changes are kept in the
    # simian-runtime-config ConfigMap across restarts and helm upgrades; the
    # chart's autonomous.* values are what "Revert" returns to. Empty: nobody.
    admins: []
    # On GKE: an external HTTPS load balancer with IAP in front of the UI's
    # port — an Ingress, a Google-managed certificate for host, an HTTP to
    # HTTPS redirect, and a BackendConfig turning IAP on with a /healthz
    # health check. Needs ui.auth=iap. IAP's Google-managed OAuth client
    # admits users in the project's organization; grant them
    # roles/iap.httpsResourceAccessor to view.
    ingress:
      enabled: false
      # The DNS name users open; it must resolve to the load balancer's IP
      # before the certificate can be issued.
      host: ""
      # A reserved global static IP's name (gcloud compute addresses create
      # NAME --global), so the address — and host's DNS record — outlive the
      # Ingress. Empty: an ephemeral address.
      staticIPName: ""
    # On GKE, the same with the Gateway API instead of an Ingress — for a
    # cluster with the Gateway API on (--gateway-api=standard), and to use a
    # certificate you already have in Certificate Manager (a wildcard, say):
    # a Gateway (gke-l7-global-external-managed) serving certificateMap, an
    # HTTPRoute for host, a GCPBackendPolicy turning IAP on with the
    # Google-managed OAuth client, and a HealthCheckPolicy on /healthz. Use
    # either ingress or gateway, not both.
    gateway:
      enabled: false
      host: ""
      # A Certificate Manager certificate map with an entry covering host.
      certificateMap: ""
      # A reserved global static IP's name. Empty: an ephemeral address.
      staticIPName: ""
    # IAP's Google-managed OAuth client authorizes only accounts in the
    # project's organization, whatever the IAP access grants say. To admit
    # others (another Workspace domain, gmail.com), create an OAuth client
    # with an External consent screen and name it here; its secret goes in a
    # Secret in the release namespace, under the key "key". Empty: the
    # Google-managed client.
    oauthClient:
      clientID: ""
      secretName: ""
    # The load balancer's request timeout in seconds (Gateway and Ingress).
    # It also bounds how long the live event stream stays open between
    # reconnects. GKE's default is 30.
    timeoutSec: 300

# MCP server.
mcp:
  port: 8081
  serviceType: ClusterIP

# Resources.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Pod security context.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  # Lets the controller write the audit volume when it is a PVC.
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
