apiVersion: apps/v1
kind: Deployment
metadata:
  name: simian-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "simian.labels" . | nindent 4 }}
spec:
  replicas: 1
  {{- if and .Values.audit.file.enabled .Values.audit.file.persistence.enabled }}
  # The audit volume is ReadWriteOnce: the old pod has to let go of it before
  # the new one can start.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "simian.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "simian.selectorLabels" . | nindent 8 }}
      {{- if .Values.metrics.enabled }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.metrics.port | quote }}
        prometheus.io/path: /metrics
      {{- end }}
    spec:
      serviceAccountName: simian-controller
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: controller
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - serve
            - --mcp-addr=:{{ .Values.mcp.port }}
            {{- /* The UI flags render only when they differ from the
                   binary's defaults, so a default install passes none an
                   older image refuses. */}}
            {{- if not .Values.ui.enabled }}
            - --ui=false
            {{- end }}
            {{- if ne (int .Values.ui.port) 8082 }}
            - --ui-addr=:{{ .Values.ui.port }}
            {{- end }}
            {{- if eq .Values.ui.auth "iap" }}
            {{- if not (or .Values.ui.iap.audience .Values.ui.iap.projectNumber) }}
            {{- fail "ui.auth=iap needs ui.iap.audience or ui.iap.projectNumber, so the UI accepts only IAP's assertions for this project" }}
            {{- end }}
            - --ui-auth=iap
            {{- with .Values.ui.iap.audience }}
            - --ui-iap-audience={{ . }}
            {{- end }}
            {{- with .Values.ui.iap.projectNumber }}
            - --ui-iap-project-number={{ . }}
            {{- end }}
            {{- range .Values.ui.iap.writers }}
            - --ui-writers={{ . }}
            {{- end }}
            {{- else if ne .Values.ui.auth "none" }}
            {{- fail (printf "ui.auth=%q: want none or iap" .Values.ui.auth) }}
            {{- else if .Values.ui.iap.writers }}
            {{- fail "ui.iap.writers needs ui.auth=iap: without IAP the UI cannot tell who anyone is" }}
            {{- end }}
            {{- if .Values.metrics.enabled }}
            - --metrics-addr=:{{ .Values.metrics.port }}
            {{- else }}
            - --metrics-addr=
            {{- end }}
            - --llm-provider={{ .Values.llm.provider }}
            {{- if .Values.llm.model }}
            - --llm-model={{ .Values.llm.model }}
            {{- end }}
            - --duration-ceiling={{ .Values.executor.durationCeiling }}
            {{- range .Values.executor.permittedTiers }}
            - --permitted-tiers={{ . }}
            {{- end }}
            - --max-concurrent-faults={{ .Values.executor.maxConcurrentFaults }}
            - --min-cooldown={{ .Values.executor.minCooldown }}
            - --recent-faults-capacity={{ .Values.executor.recentFaultsCapacity }}
            - --sut-inject-envoy-faults={{ .Values.sutInjection.envoyFaults }}
            - --topology-resync={{ .Values.topology.resync }}
            {{- range .Values.eligibleNamespaces }}
            - --eligible-namespace={{ . }}
            {{- end }}
            {{- if .Values.autonomous.enabled }}
            - --autonomous
            - --cycle-interval={{ .Values.autonomous.cycleInterval }}
            - --max-faults-per-cycle={{ .Values.autonomous.maxFaultsPerCycle }}
            - --max-severity-per-cycle={{ .Values.autonomous.maxSeverityPerCycle }}
            {{- if .Values.autonomous.hypothesisHint }}
            - --hypothesis-hint={{ .Values.autonomous.hypothesisHint | quote }}
            {{- end }}
            {{- range .Values.autonomous.namespaces }}
            - --autonomous-namespace={{ . }}
            {{- end }}
            {{- end }}
            {{- if .Values.audit.file.enabled }}
            - --audit-file={{ .Values.audit.file.path }}
            - --audit-file-max-bytes={{ .Values.audit.file.maxBytes | int64 }}
            {{- end }}
          env:
            {{- if .Values.llm.vertex.enabled }}
            - name: GOOGLE_GENAI_USE_VERTEXAI
              value: "true"
            - name: GOOGLE_CLOUD_PROJECT
              value: {{ required "llm.vertex.project is required while llm.vertex.enabled is true: --set llm.vertex.project=<your GCP project>, or set llm.vertex.enabled=false and use llm.apiKey" .Values.llm.vertex.project | quote }}
            - name: VERTEX_LOCATION
              value: {{ .Values.llm.vertex.location | quote }}
            {{- end }}
            {{- if .Values.llm.apiKey.enabled }}
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.llm.apiKey.secretRef }}
                  key: {{ .Values.llm.apiKey.secretKey }}
            {{- end }}
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: mcp
              containerPort: {{ .Values.mcp.port }}
              protocol: TCP
            {{- if .Values.ui.enabled }}
            - name: ui
              containerPort: {{ .Values.ui.port }}
              protocol: TCP
            {{- end }}
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
          {{- if .Values.audit.file.enabled }}
          volumeMounts:
            - name: audit
              mountPath: {{ dir .Values.audit.file.path }}
          {{- end }}
      {{- if .Values.audit.file.enabled }}
      volumes:
        - name: audit
          {{- if .Values.audit.file.persistence.enabled }}
          persistentVolumeClaim:
            claimName: simian-audit
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: simian-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "simian.labels" . | nindent 4 }}
  {{- if and .Values.ui.enabled .Values.ui.iap.ingress.enabled }}
  annotations:
    # The UI port's backend gets IAP and the /healthz health check (see
    # ui-iap-ingress.yaml); the load balancer reaches the pods directly.
    cloud.google.com/backend-config: '{"ports": {"ui": "simian-ui"}}'
    cloud.google.com/neg: '{"ingress": true}'
  {{- end }}
spec:
  type: {{ .Values.mcp.serviceType }}
  selector:
    {{- include "simian.selectorLabels" . | nindent 4 }}
  ports:
    - name: mcp
      port: {{ .Values.mcp.port }}
      targetPort: mcp
      protocol: TCP
    {{- if .Values.ui.enabled }}
    - name: ui
      port: {{ .Values.ui.port }}
      targetPort: ui
      protocol: TCP
    {{- end }}
    {{- if .Values.metrics.enabled }}
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
      protocol: TCP
    {{- end }}
