apiVersion: v1
kind: ServiceAccount
metadata:
  name: simian-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "simian.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-simian-discovery
  labels:
    {{- include "simian.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  # M3: cluster-wide read for the topology Discoverer's informer factory.
  # Powers get_topology and the autonomous-mode planner's context. Per-NS
  # filtering happens at Snapshot time so adding/removing arenas does not
  # require re-bootstrapping informers.
  - apiGroups: [""]
    resources: ["pods", "services", "events"]
    verbs: ["get", "list", "watch"]
  # Read-only. ZoneOutage and NodeOutage find a zone's nodes by their
  # topology.kubernetes.io/zone label, and the topology shows the planner
  # which zone each arena pod is in. Nothing here writes to a node.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-simian-discovery
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-simian-discovery
subjects:
  - kind: ServiceAccount
    name: simian-controller
    namespace: {{ .Release.Namespace }}
{{- range .Values.eligibleNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: simian-chaos
  namespace: {{ . }}
rules:
  # The baseline the autonomous loop's health gate needs. The controller writes
  # <arena>/simian-baseline whenever it establishes one; without these a
  # restart loses it and the loop stops planning (#143). get comes from the
  # read-only core rule below.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "update"]
  - apiGroups: ["chaos-mesh.org"]
    resources: ["*"]
    verbs: ["create", "get", "list", "watch", "patch", "delete"]
  - apiGroups: ["litmuschaos.io"]
    resources: ["chaosengines", "chaosresults", "chaosschedules"]
    verbs: ["create", "get", "list", "watch", "patch", "delete"]
  # The network-policy engine creates these to cause partitions. It is the
  # engine recommended on GKE Dataplane V2, where Chaos Mesh's NetworkChaos is
  # silently bypassed. Keep in sync with roleRules() in pkg/arena/arena.go; a
  # test asserts the two match.
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["create", "get", "list", "watch", "patch", "delete"]
  # The kube-state engine synthesizes workloads that are born broken, so unlike
  # every other engine it has to create an object rather than perturb one that
  # already exists. Bounded to arena namespaces, same as the rest of this Role.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create", "get", "list", "watch", "patch", "delete"]
  # The rest of that engine's bundle. Half the interesting declarative-state
  # faults are relationships between objects — a Service in front of nothing, a
  # claim that never binds — so it writes more than Deployments and has to be
  # able to take each of them out again.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "persistentvolumeclaims", "secrets"]
    verbs: ["create", "get", "list", "watch", "patch", "delete"]
  # PodDisruptionBudgets, for PDBGridlock — the one object this engine creates
  # whose effect reaches past its namespace: a budget with no headroom blocks
  # eviction of its own pods, and so blocks a drain of the node hosting them.
  # Bounded by the arena Role and by the fault's own lease.
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["create", "get", "list", "watch", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "configmaps"]
    verbs: ["get", "list", "watch"]
  # Read-only, and only for an efficacy gate: SelectorDrift proves itself by
  # finding no endpoint addresses behind its Service. Nothing here writes them.
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  {{- if $.Values.sutInController.enabled }}
  # M3 sutInController: verbs the establish_baseline MCP tool needs to
  # server-side-apply SUT manifests inside this arena from the controller.
  - apiGroups: [""]
    resources: ["services", "configmaps", "serviceaccounts"]
    verbs: ["create", "patch", "update", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["create", "patch", "update", "delete"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: simian-chaos
  namespace: {{ . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: simian-chaos
subjects:
  - kind: ServiceAccount
    name: simian-controller
    namespace: {{ $.Release.Namespace }}
{{- end }}
---
# Autonomous-mode settings an admin changed from the web UI, kept in the
# controller's own namespace across restarts (#234). Reading and updating
# are limited to that one ConfigMap; create cannot be limited by name.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: simian-runtime-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "simian.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["simian-runtime-config"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: simian-runtime-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "simian.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: simian-runtime-config
subjects:
  - kind: ServiceAccount
    name: simian-controller
    namespace: {{ .Release.Namespace }}
