# RBAC for simian-controller (chaos SA).
#
# M1 ships the chaos SA and a per-eligible-namespace Role+RoleBinding template.
# An operator applies one Role+RoleBinding per namespace they want Simian to
# operate in. M3 will introduce the provisioner SA and a ValidatingAdmissionPolicy
# that automates this.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: simian-controller
  namespace: simian-system
  labels:
    app.kubernetes.io/name: simian-agent
    app.kubernetes.io/component: controller
---
# ClusterRole grants only the cluster-scoped reads the controller needs:
# discovery (CRDs, API resources) for catalog generation, and namespace-level
# get for eligibility annotation reads. NO mutation, NO cluster-wide write.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: simian-controller-discovery
  labels:
    app.kubernetes.io/name: simian-agent
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  # M3: cluster-wide read for the topology Discoverer's informer factory.
  - apiGroups: [""]
    resources: ["pods", "services", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: simian-controller-discovery
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: simian-controller-discovery
subjects:
  - kind: ServiceAccount
    name: simian-controller
    namespace: simian-system
---
# Per-eligible-namespace Role: copy this and substitute ${EligibleNamespace}
# for each namespace you want Simian to operate in. The namespace must also
# carry the `simian.chaos/eligible: "true"` annotation; both must agree.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: simian-chaos
  namespace: ${EligibleNamespace}
  labels:
    app.kubernetes.io/name: simian-agent
rules:
  - apiGroups: ["chaos-mesh.org"]
    resources: ["*"]
    verbs: ["create", "get", "list", "watch", "patch", "delete"]
  - apiGroups: ["litmuschaos.io"]
    resources: ["chaosengines", "chaosresults", "chaosschedules"]
    verbs: ["create", "get", "list", "watch", "patch", "delete"]
  # The network-policy engine creates these to cause partitions. It is the
  # engine recommended on GKE Dataplane V2, where Chaos Mesh's NetworkChaos is
  # silently bypassed — so omitting it disabled chaos precisely where it is the
  # only option. Keep in sync with roleRules() in pkg/arena/arena.go; a test
  # asserts the two match.
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["create", "get", "list", "watch", "patch", "delete"]
  # The kube-state engine synthesizes workloads that are born broken, so unlike
  # every other engine it has to create an object rather than perturb one that
  # already exists. Bounded to arena namespaces, same as the rest of this Role.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create", "get", "list", "watch", "patch", "delete"]
  # The rest of that engine's bundle. Half the interesting declarative-state
  # faults are relationships between objects — a Service in front of nothing, a
  # claim that never binds — so it writes more than Deployments and has to be
  # able to take each of them out again.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "persistentvolumeclaims"]
    verbs: ["create", "get", "list", "watch", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "configmaps"]
    verbs: ["get", "list", "watch"]
  # Read-only, and only for an efficacy gate: SelectorDrift proves itself by
  # finding no endpoint addresses behind its Service. Nothing here writes them.
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: simian-chaos
  namespace: ${EligibleNamespace}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: simian-chaos
subjects:
  - kind: ServiceAccount
    name: simian-controller
    namespace: simian-system
