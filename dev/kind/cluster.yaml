# The kind cluster Simian's e2e tests and eval rig run against.
#
# ── Why not the default CNI ──────────────────────────────────────────
#
# Historically kindnet *accepted* NetworkPolicy objects and did not
# enforce them, which is disqualifying for an eval rig: Simian's
# network-policy engine works by creating exactly those objects, so a
# partition fault would apply cleanly, report success, block nothing, and
# the subject under test would be scored on an incident that never
# happened.
#
# Recent kindnet does enforce NetworkPolicy — measured on kind v0.31.0 /
# Kubernetes v1.35.0, reachable before a deny-all-ingress policy and
# refused after. The default CNI is still disabled here for two reasons
# that have nothing to do with that: Calico is what the eval targets look
# like, and pinning the CNI keeps the rig from silently changing
# behaviour as the node image moves. Note that "the CNI enforces it" is
# not something Simian takes on trust either way — the efficacy gate on
# every NetworkPolicy fault proves it per fault, per cluster.
#
# Calico enforces NetworkPolicy and leaves Chaos Mesh's iptables/tc
# manipulation working, which makes this the one environment that runs
# all three of Simian's implemented engines:
#
#   engine           kind + kindnet     kind + Calico   GKE Dataplane V2
#   ───────────────  ────────────────   ─────────────   ────────────────
#   chaos-mesh       yes                yes             NetworkChaos: no
#   network-policy   yes (recent only)  yes             yes
#   envoy-fault      yes                yes             yes
#
# GKE Dataplane V2 (Cilium, eBPF) bypasses the netfilter hooks Chaos Mesh
# NetworkChaos relies on — that is why the network-policy and envoy-fault
# engines exist at all. So kind+Calico is the reference environment, and
# DPv2 remains a second target where chaos-mesh NetworkChaos scenarios are
# invalid. Scenarios that depend on a specific dataplane have to declare
# it; that mechanism lands with the dataplane pack (#67).
#
# podSubnet matches Calico's default IPPool CIDR so the manifest needs no
# patching.
#
# ── Why three nodes ──────────────────────────────────────────────────
#
# Two workers, so a node-level fault can make one worker unready while
# the workloads that are supposed to survive stay scheduled on the other
# (NodeUnready, #58). Cluster shape changes invalidate every calibrated
# settle timing, so it is cheaper to pay ~40s of extra startup now than
# to re-time the corpus later.

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  disableDefaultCNI: true
  podSubnet: "192.168.0.0/16"
nodes:
  - role: control-plane
  - role: worker
  - role: worker
