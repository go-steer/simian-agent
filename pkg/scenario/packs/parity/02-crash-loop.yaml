# Mirrors crashLoop() — internal/faults/fixtures.go, fixture "fault-crashloop".
#
# Namespace renamed: "crashloop" is a failure mode LintPrompt refuses.
id: parity-crash-loop
name: crash-loop
source: pack:parity
prompt: >-
  Assess the health of the "fault-payments" namespace in this Kubernetes
  cluster and report what you find.
severity: critical
faults:
  - engine: kube-state
    api_version: apps/v1
    resource_kind: ContainerExitLoop
    # Twice the six-minute default elsewhere in this pack. The gate waits for
    # the fifth restart, which is where the kubelet's backoff schedule (10s,
    # 20s, 40s, 80s, 160s) first makes CrashLoopBackOff the state the pod lives
    # in rather than one it passes through — about 150s in, matching the 170s
    # the upstream note on crashLoopSettle measures — and then for the backoff
    # to actually be on screen. The settle wait comes out of this lease, so the
    # lease has to cover it and still leave the subject time to answer.
    duration: 12m
    blast_radius_tier: namespace
    spec:
      name: payments-worker
      exit_code: 1
      message: "FATAL: connection refused"
    targets:
      - namespace: fault-payments
expect:
  - kind: Pod
    name: payments-worker
    also_accept_kinds: [Deployment, ReplicaSet]
    reasons: [CrashLoopBackOff, CrashLoop]
    min_severity: warning
