# Mirrors examples/scenarios/pending in k8s-lookout.
#
# A pod no node can ever schedule. The observer's point is the *aging*: a pod
# Pending for two seconds is a slow scheduler and a pod Pending for ninety is a
# fault, and only the second is worth waking anyone for.
#
# request_cpu is left at the engine default rather than lookout's 64. Sixty-four
# cores is unschedulable on kind and is a provisioning signal on a managed
# cluster: an autoscaler would add a node and heal the fault mid-run. The
# default is far beyond any machine shape for exactly that reason.
#
# pending_dwell is the one place in this pack where a scenario is calibrated to
# the detector it mirrors, and it has to be. The observer will not call a
# Pending pod a fault until it is older than its `--pending-age`, five minutes
# by default. Simian's own line is ninety seconds, so the default gate hands the
# scenario over at a moment when the correct answer, by the subject's own
# definition, is "nothing is wrong yet" — and the run scores that as a miss.
# What it would actually be measuring is the grace period, not the judgment.
#
# Five and a half minutes: the observer's threshold plus enough margin that a
# slow first read cannot land inside it. That makes the whole scenario slow —
# the hold alone is longer than most of the pack put together — which is why it
# is not in the push smoke set.
#
# This is legitimate here and would not be in the engine default. A parity pack
# exists to reproduce another project's own examples; an engine default that
# copied one observer's threshold would score every subject on that observer's
# clock. See KubeStateDefaultPendingDwell.
id: lookout-pending
name: pending
source: pack:lookout
prompt: >-
  Assess the health of the "lookout-analytics" namespace in this Kubernetes
  cluster and report what you find.
severity: critical
faults:
  - engine: kube-state
    api_version: apps/v1
    resource_kind: Unschedulable
    # The gate's hold comes out of the lease, so the lease has to outlast it
    # with room for the subject to be asked afterwards. Twelve minutes: five and
    # a half of dwell, the gate's own headroom, and the rest for the subject.
    # Under the executor's fifteen-minute ceiling with margin to spare.
    duration: 12m
    blast_radius_tier: namespace
    spec:
      name: hog
      pending_dwell: 5m30s
    targets:
      - namespace: lookout-analytics
expect:
  # Unschedulable and FailedScheduling are both accepted here and are both
  # generic in pkg/eval — the scheduler writes them for taints, selectors,
  # unbound volumes and genuine shortage alike. Accepting them costs nothing:
  # a token that names no cause can be credited for recall and can never be
  # charged as an invention.
  - kind: Pod
    name: hog
    also_accept_kinds: [Deployment, ReplicaSet]
    reasons:
      - Unschedulable
      - FailedScheduling
      - InsufficientCPU
      - InsufficientResources
      - Pending
      - capacity.pending-aged
    min_severity: warning
