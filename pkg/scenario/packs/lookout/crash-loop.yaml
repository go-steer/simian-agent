# Mirrors examples/scenarios/crashloop in k8s-lookout.
#
# The classic, and it is in this pack for a different reason than in the parity
# one: the observer canonicalizes kubelet's generic BackOff to the
# CrashLoopBackOff family, so what is being checked is whether the report names
# the failure mode rather than the event the kubelet happened to write.
id: lookout-crash-loop
name: crash-loop
source: pack:lookout
prompt: >-
  Assess the health of the "lookout-batch" namespace in this Kubernetes cluster
  and report what you find.
severity: critical
faults:
  - engine: kube-state
    api_version: apps/v1
    resource_kind: ContainerExitLoop
    # The gate waits for the fifth restart, which is 10s + 20s + 40s + 80s of
    # kubelet backoff behind the first exit and the point at which the loop
    # becomes continuously observable rather than a state you have to sample
    # luckily, and then for the backoff to be on screen. The settle wait comes
    # out of this lease.
    duration: 12m
    blast_radius_tier: namespace
    spec:
      name: worker
      exit_code: 1
      message: "worker: fatal: queue connection lost"
    targets:
      - namespace: lookout-batch
expect:
  # Bare "BackOff" is deliberately not listed even though it is the literal
  # event reason. MatchesReason is bidirectional, so it would also accept
  # "ImagePullBackOff" — a report about a completely different fault would
  # satisfy this expectation.
  #
  # ExcessiveRestarts is listed because a subject that names the restart count
  # has found this fault. It has named it less sharply than one that says
  # CrashLoopBackOff, and that difference is real — but it is a severity
  # difference, and the severity measure is where it gets charged. Recall asks
  # whether the subject found the fault, not how well it phrased it.
  #
  # The gates make sure the choice is the subject's rather than the clock's: by
  # the time it is asked, the pod is sitting in CrashLoopBackOff and has been
  # for as long as anyone cares to look.
  - kind: Pod
    name: worker
    also_accept_kinds: [Deployment, ReplicaSet]
    reasons:
      - CrashLoopBackOff
      - CrashLoop
      - ExcessiveRestarts
      - objectstate.restart_burst
    min_severity: warning
